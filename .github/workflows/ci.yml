name: CI

# No `schedule` trigger. The pipeline is launched by hand; CI only checks the code.
# Frozen on 2026-09-18. The workflows below ran green on the commit this repository
# publishes, and the Actions tab holds that run. They fire by hand from now on: a
# repository nobody maintains should not go red on a dependency that moved.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      # Checks only, no rewriting: `ruff format` is a local hook, not a CI step.
      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Bandit
        run: uv run python -m bandit -c pyproject.toml -r src

      - name: Pytest
        run: uv run python -m pytest
