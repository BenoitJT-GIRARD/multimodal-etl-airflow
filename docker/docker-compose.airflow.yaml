# docker-compose — Apache Airflow en local (executeur LocalExecutor).
#
# Configuration volontairement minimale et lisible (un seul scheduler + webserver
# + une base de metadonnees PostgreSQL), suffisante pour faire tourner le DAG
# `multimodal_etl` en local et produire des preuves d'execution (logs, UI).
#
# Demarrage :  docker compose -f docker/docker-compose.airflow.yaml up -d
# Interface :  http://localhost:8080  (identifiants : airflow / airflow)
# Voir le pas-a-pas complet dans docs/runbook_airflow.md.

x-airflow-common: &airflow-common
  # Image Airflow officielle enrichie des dependances du pipeline (cf. Dockerfile).
  image: multimodal_etl/airflow:2.10.4
  build:
    context: .
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Le package multimodal_etl est rendu importable via le code source monte.
    PYTHONPATH: /opt/airflow/project/src
    # Cle NewsData.io transmise depuis docker/.env (source API optionnelle).
    NEWSDATA_API_KEY: ${NEWSDATA_API_KEY:-}
    MULTIMODAL_ETL_DB_URL: ${MULTIMODAL_ETL_DB_URL:-}
  volumes:
    - ../dags:/opt/airflow/dags
    # Les journaux Airflow restent dans un volume Docker : les monter sur le disque
    # hote poserait un probleme de droits d'ecriture (surtout sous Windows).
    - airflow-logs:/opt/airflow/logs
    - ../:/opt/airflow/project
  # AIRFLOW_UID : identifiant de l'utilisateur qui ecrit dans le projet monte.
  # Sous Linux/macOS, mettre la sortie de `id -u`. Sous Windows, 0 (root) evite les
  # refus d'ecriture sur le dossier data/ partage.
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username airflow --password airflow \
          --firstname Benoit --lastname Girard \
          --role Admin --email airflow@example.com || true
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
  airflow-logs:
