# docker-compose — Apache Airflow, locally, on the LocalExecutor.
#
# Deliberately minimal and readable (one scheduler + webserver, plus a PostgreSQL
# metadata database), which is enough to run the `multimodal_etl` DAG locally and
# produce run evidence (logs, UI).
#
# Start with:  docker compose -f docker/docker-compose.airflow.yaml up -d
# Interface:   http://localhost:8080  (credentials: airflow / airflow)
# The full walkthrough is in docs/airflow_runbook.md.

x-airflow-common: &airflow-common
  # The official Airflow image, with the pipeline's dependencies added (see Dockerfile).
  image: multimodal_etl/airflow:2.10.4
  build:
    context: .
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # The multimodal_etl package is made importable through the mounted source tree.
    PYTHONPATH: /opt/airflow/project/src
    # NewsData.io key passed through from docker/.env (an optional API source).
    NEWSDATA_API_KEY: ${NEWSDATA_API_KEY:-}
    MULTIMODAL_ETL_DB_URL: ${MULTIMODAL_ETL_DB_URL:-}
  volumes:
    - ../dags:/opt/airflow/dags
    # The Airflow logs stay in a Docker volume: mounting them on the host disk would
    # raise write-permission problems, especially on Windows.
    - airflow-logs:/opt/airflow/logs
    - ../:/opt/airflow/project
  # AIRFLOW_UID: the user id that writes into the mounted project.
  # On Linux/macOS use the output of `id -u`. On Windows, 0 (root) avoids write
  # refusals on the shared data/ folder.
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username airflow --password airflow \
          --firstname Benoit --lastname Girard \
          --role Admin --email airflow@example.com || true
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
  airflow-logs:
