[project]
name = "multimodal_etl"
version = "0.1.0"
description = "Multimodal ETL pipeline collecting text-and-image publications for fake-news detection."
readme = "README.md"
authors = [{ name = "Benoît J. T. GIRARD", email = "53222414+BenoitJT-GIRARD@users.noreply.github.com" }]
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
keywords = [
    "data-engineering",
    "etl",
    "airflow",
    "multimodal",
    "fake-news",
    "web-scraping",
]

dependencies = [
    # Extraction
    "requests>=2.32",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    # 5.3 renames `registered_domain` to `top_domain_under_public_suffix`.
    "tldextract>=5.3",
    "python-dotenv>=1.0",
    # Transformation / storage
    "pandas>=2.2",
    "pyarrow>=16",
    "pillow>=10.4",
    "sqlalchemy>=2.0",
    # KPI dashboard
    "streamlit>=1.39",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "bandit[toml]>=1.7",
    "pre-commit>=4.0",
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "nbconvert>=7.16",
    "nbclient>=0.10",
    "matplotlib>=3.11.1",
    # The dashboard is a websocket page: Chrome headless photographs its empty skeleton, so
    # the captures go through a browser that waits for a selector.
    "playwright>=1.48",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multimodal_etl"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "reports", "var", "notebooks/.ipynb_checkpoints"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "RUF", # ruff-native rules
]
ignore = [
    "E501",  # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"scripts/*" = ["T201"]
"dags/*" = ["E402"]
# A notebook spreads its imports across cells: the first one bootstraps the environment, and
# the ones that follow sit next to the code that uses them, which is what makes a notebook
# readable top to bottom.
"notebooks/**/*.ipynb" = ["E402", "F401", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# `scripts/` is on the path so the unit tier can import a script and test the function it
# holds, instead of shelling out to it and asserting on printed text.
pythonpath = ["scripts"]
addopts = "-ra --strict-markers --cov --cov-branch --cov-report=term-missing --cov-report=xml"
markers = [
    "integration: two real components of the repository wired together, or one against a real external dependency",
    "system: the product started the way the README says to start it, questioned through its public surface",
    "claim: fails when a published number, figure, table or artefact stops matching the code",
    "simulation: replays a complete scenario on frozen data, with no real service",
    "slow: takes long enough that a reader deserves to be told before running it",
]
# Warnings are errors. Two blanket `ignore::` lines used to hide every
# DeprecationWarning and FutureWarning; the first run without them found a deprecated
# tldextract property being called on every transformed record. No exemption is needed.
filterwarnings = ["error"]

[tool.coverage.run]
# Without this, the published XML report writes the absolute root of the measured sources:
# a reader finds the directory tree of the machine that ran the suite, and two runs on two
# machines produce two different files for the same numbers.
relative_files = true
# Three directories carry tracked Python, and all three are measured. `src/` alone left the
# five scripts a reader is told to run, and the DAG, outside the number the badge publishes.
source = ["src/multimodal_etl", "scripts", "dags"]
branch = true
data_file = "var/.coverage"
omit = [
    # Copied in rather than imported, so a clone needs nothing extra to install, and tested
    # at their source. Measuring them here would report someone else's coverage as this
    # project's.
    "*/figure_style.py",
    "*/utils/paths.py",
    "scripts/capture.py",
    "scripts/smoke.py",
    "scripts/run_notebooks.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
# The floor is the rate measured the day the suite was completed, rounded down. A floor
# below the current rate is not a floor: it lets the next commit lose coverage in silence.
fail_under = 76
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.coverage.xml]
# Tracked: a published result a reader can open, and what the coverage badge recomputes from.
output = "reports/coverage/coverage.xml"

[tool.coverage.html]
# Not tracked: generated pages nobody reviews in a diff.
directory = "var/coverage-html"

[tool.bandit]
exclude_dirs = ["tests", "data", "reports", "var", ".venv"]
skips = ["B101"]
